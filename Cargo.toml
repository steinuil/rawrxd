[package]
name = "rawrxd"
version = "0.1.0"
edition = "2021"

[dependencies]
aho-corasick = "1.1.3"
arbitrary = { version = "1.4.2", features = ["derive"], optional = true }
crc32fast = "1.5.2"
thiserror = "2.0.3"
time = { version = "0.3.17", features = ["serde-human-readable"] }

[dev-dependencies]
rstest = "0.23"

[features]
arbitrary = ["dep:arbitrary"]
